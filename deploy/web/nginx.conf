# nginx hinter Traefik (TLS endet dort). Wird als conf.d/default.conf geladen,
# steht also im http-Kontext.
#
#   /            Landingpage (site/)
#   /app/        Karten-App (web/dist), SPA-Fallback auf /app/index.html
#   /app/data/   PMTiles (Volume, nur lesend) – per Range-Request gelesen, nie komprimiert
#
# Hinweis zu add_header: Eine Location mit eigenem add_header erbt keine add_header-Zeilen vom
# Server. Deshalb gibt es auf Server-Ebene keine, und jede Location setzt ihr Cache-Control selbst.

# Cache-Control für alles ohne eigene Location: HTML immer prüfen, Rest kurz cachen.
# (Leerer Wert = Header wird nicht gesendet; gilt auch nach dem try_files-Fallback.)
map $sent_http_content_type $default_cache_control {
    default       "public, max-age=3600";
    ~^text/html   "no-cache";
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    # Textdateien (Lizenztexte .txt) enthalten ©/Umlaute: ohne Charset raten Browser falsch.
    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects ohne Host/Schema: Traefik terminiert TLS, nginx sähe sonst http://
    absolute_redirect off;

    # Echte Client-IP im Log (Traefik hängt sie an X-Forwarded-For an)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;

    # Landingpage
    location / {
        add_header Cache-Control $default_cache_control;
        try_files $uri $uri/ =404;
    }

    # App: /app -> /app/, unbekannte Pfade fallen auf index.html
    location = /app {
        return 301 /app/;
    }
    location /app/ {
        add_header Cache-Control $default_cache_control;
        try_files $uri $uri/ /app/index.html;
    }

    # Vite-Assets haben Hash im Namen
    location /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;

        # MapLibre-Worker ist ein ES-Modul (.mjs); nginx' mime.types kennt die Endung nicht und
        # sendet application/octet-stream – Browser verweigern dann das Laden des Workers.
        location ~ \.mjs$ {
            types { }
            default_type text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }

    # Schriftkacheln (.pbf = Protobuf, schon komprimiert); OFL.txt (Lizenztext) wird angezeigt
    location /app/fonts/ {
        types { application/x-protobuf pbf; text/plain txt; }
        default_type application/octet-stream;
        gzip off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # PMTiles: Range-Requests (206) funktionieren bei statischen Dateien von selbst – deshalb
    # kein gzip. Kein open_file_cache: eine ersetzte Datei (mv im Updater) gilt ab dem nächsten
    # Request. Kurzer Cache + Revalidierung per ETag/Last-Modified.
    location /app/data/ {
        types { application/vnd.pmtiles pmtiles; }
        default_type application/octet-stream;
        gzip off;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }
}
