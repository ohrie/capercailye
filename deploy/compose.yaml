# Karten-App hinter Traefik. Einrichtung und Deploy: README.md, Variablen: .env.
name: capercailye

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    image: capercailye-web
    container_name: capercailye-web
    restart: unless-stopped
    mem_limit: 256m
    networks: [capercailye]
    volumes:
      # PMTiles-Dateien; geschrieben wird nur vom Updater
      - ${DATA_ROOT:?DATA_ROOT fehlt in .env}/live:/usr/share/nginx/html/app/data:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=capercailye_network
      # HTTPS-Router
      - traefik.http.routers.capercailye.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.capercailye.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.capercailye.tls=true
      - traefik.http.routers.capercailye.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.capercailye.service=capercailye
      - traefik.http.services.capercailye.loadbalancer.server.port=80
      # HTTP-Router: Weiterleitung auf HTTPS (falls der Traefik keine globale Weiterleitung hat)
      - traefik.http.routers.capercailye-http.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.capercailye-http.entrypoints=web
      - traefik.http.routers.capercailye-http.middlewares=capercailye-to-https
      - traefik.http.routers.capercailye-http.service=capercailye
      - traefik.http.middlewares.capercailye-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.capercailye-to-https.redirectscheme.permanent=true
      # Keine Kompression-Middleware an diesen Routern (würde Range-Antworten der PMTiles verändern).

  # Wöchentlicher Neuaufbau der Kacheln (Dienstag 02:23 Europe/Berlin), Tausch in live/. Kein Port,
  # nur im Standardnetzwerk des Projekts, nicht im Traefik-Netzwerk. Rechte, Zeitplan und Handlauf: README.md.
  updater:
    build:
      context: ..
      dockerfile: deploy/updater/Dockerfile
    image: capercailye-updater
    container_name: capercailye-updater
    restart: unless-stopped
    mem_limit: ${UPDATER_MEM_LIMIT:-5g}
    cpus: ${UPDATER_CPUS:-4}
    environment:
      JAVA_XMX: ${JAVA_XMX:-3g}
      THREADS: ${UPDATER_CPUS:-4}
      TZ: Europe/Berlin
    volumes:
      - ${DATA_ROOT:?DATA_ROOT fehlt in .env}:/srv/capercailye
    labels:
      # Hat der Traefik exposedbydefault=true, würde er den Updater sonst veröffentlichen: ausdrücklich abschalten
      - traefik.enable=false

# Das Netzwerk legt dieses Projekt selbst an (fester Name); der Traefik hängt sich als externes
# Netzwerk daran (siehe README.md).
networks:
  capercailye:
    name: capercailye_network
