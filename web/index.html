<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>capercailye</title>
    <script defer src="https://analytics.chilla.dev/script.js" data-website-id="89a79309-5637-4b3a-a582-434d670902f1" data-domains="capercailye.chilla.dev,capercaillie.chilla.dev" data-exclude-hash="true"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Einstellungen">
        <header class="sidebar__header">
          <h1 class="brand">capercailye</h1>
          <button
            class="icon-button"
            id="sidebar-collapse"
            type="button"
            title="Seitenleiste einklappen"
            aria-label="Seitenleiste einklappen"
          >
            ‹
          </button>
        </header>

        <section class="panel panel--search" role="search" aria-label="Suche">
          <label class="visually-hidden" for="search-input">Ort oder Gipfel suchen</label>
          <input
            class="search__input"
            id="search-input"
            type="search"
            placeholder="Ort oder Gipfel suchen"
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-expanded="false"
            aria-controls="search-results"
            aria-autocomplete="list"
            aria-keyshortcuts="/"
          />
          <ul
            class="search__results"
            id="search-results"
            role="listbox"
            aria-label="Treffer"
            hidden
          ></ul>
          <p class="hint" id="search-state" role="status" aria-live="polite" hidden></p>
        </section>

        <section class="panel panel--mode" aria-label="Modus">
          <div class="segmented" role="radiogroup" aria-label="Modus, Schritte 1 bis 3">
            <label
              ><input type="radio" name="map-mode" value="explore" checked /><span
                ><b class="step" aria-hidden="true">1</b>Erkunden</span
              ></label
            >
            <label title="Gebiet zeichnen"
              ><input type="radio" name="map-mode" value="draw" /><span
                ><b class="step" aria-hidden="true">2</b>Zeichnen</span
              ></label
            >
            <label
              ><input type="radio" name="map-mode" value="sheets" /><span
                ><b class="step" aria-hidden="true">3</b>Seiten</span
              ></label
            >
          </div>
          <p class="hint" id="mode-hint"></p>
        </section>

        <section class="panel" id="print-panel" aria-labelledby="print-heading" hidden>
          <h2 class="panel__title" id="print-heading">Druck</h2>

          <div class="field">
            <span class="field__label">Vorgabe</span>
            <div class="segmented" role="radiogroup" aria-label="Vorgabe">
              <label
                ><input type="radio" name="print-mode" value="pages" /><span
                  >Seitenzahl</span
                ></label
              >
              <label
                ><input type="radio" name="print-mode" value="scale" checked /><span
                  >Maßstab</span
                ></label
              >
            </div>
          </div>

          <label class="field" id="field-scale">
            <span class="field__label">Maßstab</span>
            <select id="print-scale">
              <option value="15000">1:15 000</option>
              <option value="25000" selected>1:25 000</option>
              <option value="50000">1:50 000</option>
            </select>
          </label>

          <label class="field" id="field-pages" hidden>
            <span class="field__label">Seitenzahl</span>
            <select id="print-pages">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="6" selected>6</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="12">12</option>
            </select>
          </label>

          <div class="field">
            <span class="field__label">Ausrichtung</span>
            <div class="segmented" role="radiogroup" aria-label="Ausrichtung">
              <label
                ><input type="radio" name="orientation" value="portrait" checked /><span
                  >Hoch</span
                ></label
              >
              <label
                ><input type="radio" name="orientation" value="landscape" /><span>Quer</span></label
              >
            </div>
          </div>

          <label class="switch">
            <input type="checkbox" id="print-view" />
            <span class="switch__track" aria-hidden="true"></span>
            <span>Druckansicht</span>
          </label>

          <p class="hint" id="print-info"></p>
          <p class="hint hint--warn" id="print-note" hidden></p>

          <button class="button button--primary" id="export-pdf" type="button">
            <svg
              class="button__icon"
              viewBox="0 0 16 16"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M8 2v7.5M4.75 6.5 8 9.75l3.25-3.25M2.5 10.5v3h11v-3" />
            </svg>
            <span class="button__label">PDF exportieren</span>
          </button>
          <p class="status" id="export-status" role="status" aria-live="polite"></p>
        </section>

        <section class="panel" aria-labelledby="gpx-heading">
          <h2 class="panel__title" id="gpx-heading">GPX-Track</h2>
          <input id="gpx-file" type="file" accept=".gpx,application/gpx+xml,text/xml" hidden />
          <button class="button" id="gpx-load" type="button">
            <svg
              class="button__icon"
              viewBox="0 0 16 16"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M8 9.5V2M4.75 5.25 8 2l3.25 3.25M2.5 10.5v3h11v-3" />
            </svg>
            <span class="button__label">GPX-Datei laden</span>
          </button>
          <p class="hint" id="gpx-hint">Oder eine Datei auf die Karte ziehen.</p>
          <div class="track" id="gpx-info" hidden>
            <p class="track__name" id="gpx-name"></p>
            <p class="hint" id="gpx-length"></p>
            <div class="button-row">
              <button class="button" id="gpx-area" type="button">Gebiet auf Track setzen</button>
              <button class="button" id="gpx-remove" type="button">Track entfernen</button>
            </div>
          </div>
          <p class="status status--error" id="gpx-status" role="status" aria-live="polite"></p>
        </section>

        <section class="panel" aria-labelledby="layers-heading">
          <h2 class="panel__title" id="layers-heading">Ebenen</h2>
          <div id="layer-toggles" class="layers"></div>
        </section>

        <!-- Filled by main.ts (credits with the data dates). -->
        <footer class="sidebar__footer" id="attribution"></footer>
        <nav class="sidebar__legal" aria-label="Rechtliches">
          <a href="/impressum/" target="_blank" rel="noopener">Impressum</a>
          <a href="/datenschutz/" target="_blank" rel="noopener">Datenschutz</a>
        </nav>
      </aside>

      <main class="map" id="map">
        <button
          class="icon-button map__expand"
          id="sidebar-expand"
          type="button"
          title="Seitenleiste öffnen"
          aria-label="Seitenleiste öffnen"
        >
          ›
        </button>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
